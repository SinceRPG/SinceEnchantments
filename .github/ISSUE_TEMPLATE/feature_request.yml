name: Feature request
description: Suggest a new SinceEnchantments feature or config option.
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem or use case
      description: What server workflow or player experience should this improve?
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: Describe the command, config option, hook, item, GUI behavior, or API you want.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives tried
      description: Mention config workarounds, other plugins, or manual steps you tried.
    validations:
      required: false
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Screenshots, item examples, config snippets, or compatibility notes.
    validations:
      required: false
