plugins {
    id 'java'
    id("xyz.jpenilla.run-paper") version "2.3.1"
}

group = 'net.danh'
version = '1.2.4'

repositories {
    mavenCentral()
    maven {
        name = "crazycrew-releases"
        url = "https://repo.crazycrew.us/releases/"
    }
    maven {
        name = "papermc-repo"
        url = "https://repo.papermc.io/repository/maven-public/"
    }
    maven {
        name = "codemc-repo-releases"
        url = "https://repo.codemc.io/repository/maven-releases/"
    }
    maven {
        name = "codemc-repo-releases"
        url = "https://repo.codemc.io/repository/maven-snapshots/"
    }
    maven {
        name = "nightexpress-releases"
        url = "https://repo.nightexpressdev.com/releases"
    }
}

dependencies {
    compileOnly("io.papermc.paper:paper-api:1.21.11-R0.1-SNAPSHOT")
//    compileOnly("io.papermc.paper:paper-api:26.1.1.build.+")
    compileOnly("com.github.retrooper:packetevents-spigot:2.13.0")
    compileOnly("com.badbones69.crazyenchantments:crazyenchantments-paper-api:2.5")
    compileOnly("su.nightexpress.nightcore:main:2.16.2")
    compileOnly("su.nightexpress.excellentenchants:Core:5.4.3")
}

tasks {
    runServer {
        // Configure the Minecraft version for our task.
        // This is the only required configuration besides applying the plugin.
        // Your plugin's jar (or shadowJar if present) will be used automatically.
//        minecraftVersion("26.1.1")
        minecraftVersion("1.21")
    }
}

//def targetJavaVersion = 25
def targetJavaVersion = 21
java {
    def javaVersion = JavaVersion.toVersion(targetJavaVersion)
    sourceCompatibility = javaVersion
    targetCompatibility = javaVersion
    if (JavaVersion.current() < javaVersion) {
        toolchain.languageVersion = JavaLanguageVersion.of(targetJavaVersion)
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'

    if (targetJavaVersion >= 10 || JavaVersion.current().isJava10Compatible()) {
        options.release.set(targetJavaVersion)
    }
}

processResources {
    def props = [version: version]
    inputs.properties props
    filteringCharset 'UTF-8'
    filesMatching('paper-plugin.yml') {
        expand props
    }
}
