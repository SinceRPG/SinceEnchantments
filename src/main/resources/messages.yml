prefix: "&8[&bSinceEnchantments&8] &r"
reload: "&aConfiguration successfully reloaded!"
enchant-not-found: "&cThe enchantment '%enchant%' does not exist in Bukkit or Custom Registry!"
invalid-extractor-type: "&cInvalid extractor type! Use 'random' or 'specific'."

help-header: "&8&m--------&r &bSinceEnchantments &8&m--------"
help-commands:
  - "&b/se help &7- Displays this help menu."
  - "&b/se reload &7- Reloads the plugin configuration."
  - "&b/se givebook <player> <enchant> <level> [success] [destroy] &7- Gives an enchantment book."
  - "&b/se giveextractor <player> <random|specific> <amount> &7- Gives an extractor."
  - "&b/se givecharm <player> <bonus> [amount] &7- Gives a success charm."
  - "&b/se giveslotgem <player> <modifier> [amount] &7- Gives a Slot Gem."
  - "&b/se givelock <player> [amount] &7- Gives a Lock Scroll."
  - "&b/se givepurge <player> <return_books: true|false> [amount] &7- Gives a Purge Scroll."
  - "&b/se giverandomizer <player> [amount] &7- Gives a Randomizer Stone."
  - "&b/se giveprotector <player> [amount] &7- Gives a Protection Gem."
  - "&b/se givetracker <player> [amount] &7- Gives a Stat Tracker."

give-book-success: "&aGave %enchant% book (Level %level%) to %player%."
