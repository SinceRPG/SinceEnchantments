# ==========================================
# GENERAL SETTINGS
# ==========================================
settings:
  # The exact string you must put in your item's lore (e.g., via MMOItems or Vanilla commands)
  # where you want the plugin to inject the custom enchantments list.
  placeholder: "{enchants}"

  # IMPORTANT: Compatibility Mode for MMOItems / Custom Enchant Plugins!
  # TRUE: The plugin will hide all default Minecraft enchantments (and other plugins' enchants)
  #       and rewrite them beautifully inside the {enchants} placeholder.
  # FALSE: The plugin will IGNORE vanilla enchants and ONLY inject its own custom enchantments
  #        into the {enchants} placeholder. Set this to FALSE if you use MMOItems stats or EcoEnchants.
  override-vanilla-enchants: true

  # How many enchantments should be displayed on a single line of lore?
  # Setting this to 1 makes it look like Vanilla. Setting it to 2 or 3 saves lore space.
  enchants-per-line: 2

  # The text/color used to separate multiple enchantments on the same line (if enchants-per-line > 1).
  separator: "&8 | "

  # The default color applied to Vanilla enchantments (if override-vanilla-enchants is true).
  default-color: "&9"

  # Should the plugin automatically add a blank line above the enchantments list for better spacing?
  add-empty-line-above: true

  # Should the plugin automatically add a blank line below the enchantments list?
  add-empty-line-below: true

  # How should enchantment levels be displayed?
  # Options: "ROMAN" (I, II, III, IV, V) or "NUMBER" (1, 2, 3, 4, 5).
  level-format: "ROMAN"

  # The absolute maximum number of CUSTOM enchantments a single item can hold.
  # This prevents players from creating overpowered god-items.
  default-max-custom-enchants-per-item: 5

  # The visual divider line placed between Vanilla enchantments and Custom enchantments.
  divider: "&8&m                         &8&m"

  # The amount of XP Levels it costs to combine two identical custom enchantment books in an Anvil.
  anvil-xp-combine-books: 5

  # The amount of XP Levels it costs to apply a custom enchantment book directly to a weapon/armor in an Anvil.
  anvil-xp-apply-book: 3

  # Which menu system should the Specific Extractor open?
  # "DIALOG": Uses the modern, glitch-free Paper 1.21.6+ Native Dialog API (Highly Recommended).
  # "GUI": Uses the legacy 54-slot Chest Inventory menu.
  extractor-mode: "DIALOG"

  # Display the number of Slot Enchant (Default: true)
  show-slots: true
  slots-format: "&7Enchantment Slots: &e%current% / %max%"

  # The line displayed when the item is locked.
  locked-format: "&c&lLocked Enchant"

  # If true, items that are bound by a specific whitelist will display a preview
  # of all allowed enchantments directly in their lore.
  # (Note: Items that allow all enchantments by default will not display this preview).
  show-whitelist-preview: true

  # The title or header text displayed directly above the whitelist preview list in the item's lore.
  whitelist-header: "&8Allowed Enchantments:"

  # The text format used for each individual enchantment listed under the whitelist header.
  # Available placeholders: %enchant_name%
  whitelist-preview-format: "&8 - %enchant_name%"

  # If the total number of enchantments applied to an item is less than or equal to this threshold,
  # the item will display them in a "Detailed Mode" (showing the Enchant Name + Level, followed by its full description).
  # If the total number of enchantments exceeds this number, the display will automatically collapse
  # into a "Compact Mode" (hiding descriptions and grouping multiple enchants per line based on 'enchants-per-line').
  detailed-display-threshold: 5

  # Defines the absolute maximum number of extra slots a player can add to an item using Slot Gems.
  # For example, if a sword naturally has 2 slots, and this is set to 5, the player can only use
  # Slot Gems until the item gains +5 bonus slots (making the total 7 slots).
  # This acts as a hard cap to prevent players from applying an infinite amount of Slot Gems
  # to a single item and creating completely broken, overpowered weapons.
  max-slot-modifiers-allowed: 5

  # Format for newly added features
  protected-format: "&a&lProtected &7(Keeps on death)"
  tracker-header: "&8&m      &r &6&lStat Tracker &8&m      "
  tracker-blocks: "&7Blocks Mined: &e%value%"
  tracker-mobs: "&7Mobs Killed: &e%value%"
  tracker-players: "&7Players Killed: &c%value%"
  tracker-fish: "&7Fish Caught: &b%value%"

# ==========================================
# RARITY SYSTEM
# ==========================================
# Define the color codes associated with each rarity tier.
# These keys (COMMON, UNCOMMON, etc.) are referenced in the custom-enchants section below.
rarities:
  COMMON: "&f"       # White
  UNCOMMON: "&a"     # Green
  RARE: "&9"         # Blue
  EPIC: "&5"         # Purple
  LEGENDARY: "&6&l"  # Gold & Bold