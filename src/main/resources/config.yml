settings:
  placeholder: "{enchants}"
  enchants-per-line: 2
  separator: "&8 | "
  default-color: "&9"
  add-empty-line-above: true
  add-empty-line-below: true
  level-format: "ROMAN"
  max-custom-enchants-per-item: 5
  divider: "&8&m                         &8&m"
  anvil-xp-combine-books: 5
  anvil-xp-apply-book: 3
  # Specific Extractor Mode: "GUI" (Traditional Chest) or "DIALOG" (Paper 1.21.6+ Dialog)
  extractor-mode: "DIALOG"

# ==========================================
# DIALOG CONFIGURATIONS (PAPER 1.21.6+)
# ==========================================
dialog:
  extractor:
    title: "<dark_gray><bold>Extract Enchantment"
    body: "<gray>Choose an enchantment from your item below\n<gray>to extract it safely into a book."
    columns: 3 # Number of button columns to display (recommended: 3 or 4)
    cancel-button:
      name: "<red><bold>Cancel & Refund"
      tooltip: "<gray>Click to cancel extraction\n<gray>and get your extractor back."
    enchant-button:
      name: "%rarity_color%%enchant_name% %level%"
      tooltip: "<gray>Click to extract <yellow>%enchant_name%\n<gray>from your item and destroy the extractor."

# ==========================================
# GUI CONFIGURATIONS (LEGACY)
# ==========================================
gui:
  extractor:
    title: "&8Select Enchant (Page %page%)"
    size: 54 # Must be 27, 36, 45, or 54
    border:
      material: "BLACK_STAINED_GLASS_PANE"
      name: " "
    next-page:
      material: "ARROW"
      name: "&aNext Page"
      slot: 53
    prev-page:
      material: "ARROW"
      name: "&cPrevious Page"
      slot: 45
    display-item:
      material: "ENCHANTED_BOOK"
      name: "%rarity_color%%enchant_name% %level%"
      lore:
        - "&7Click to safely extract"
        - "&7this enchantment into a book!"

# ==========================================
# RARITY SYSTEM
# ==========================================
rarities:
  COMMON: "&f"
  UNCOMMON: "&a"
  RARE: "&9"
  EPIC: "&5"
  LEGENDARY: "&6&l"

# ==========================================
# CUSTOM ENCHANTS
# ==========================================
custom-enchants:
  "since:lifesteal":
    name: "Lifesteal"
    rarity: "EPIC"
    max-level: 5
    target: "WEAPON"
    description:
      - "&7Heals you for a portion"
      - "&7of your max health on hit."
    settings:
      heal-multiplier: 1.0
    messages:
      action: "&a+ %amount% HP (Lifesteal)!"

  "since:fireball":
    name: "Fireball"
    rarity: "LEGENDARY"
    max-level: 3
    target: "SWORD"
    description:
      - "&7Left-click the air to"
      - "&7shoot a destructive fireball."
    settings:
      cooldown: 5000
      explosion-power: 2.0
    messages:
      on-cooldown: "&cSkill is on cooldown for %time%s!"
      launch: "&6Boom! Fireball launched!"

  "since:thunder":
    name: "Thunder Strike"
    rarity: "RARE"
    max-level: 5
    target: "WEAPON"
    description:
      - "&7Chance to strike lightning"
      - "&7on your enemies."
    settings:
      chance-per-level: 8
      extra-damage: 3.0
    messages:
      activate: "&b⚡ Lightning struck the target!"

  "since:excavator":
    name: "Excavator"
    rarity: "LEGENDARY"
    max-level: 2
    target: "TOOL"
    description:
      - "&7Mines a 3x3 area"
      - "&7around the broken block."
    settings:
      radius: 1
    messages:
      activate: "&eArea mining activated!"

  "since:dodge":
    name: "Dodge"
    rarity: "EPIC"
    max-level: 4
    target: "ARMOR"
    description:
      - "&7Chance to completely"
      - "&7evade incoming damage."
    settings:
      chance-per-level: 5
    messages:
      activate: "&fSuccessfully dodged an attack!"

