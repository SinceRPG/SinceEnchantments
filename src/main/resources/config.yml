# ==========================================
# CẤU HÌNH SINCE ENCHANTMENTS
# ==========================================

settings:
  # Placeholder để MMOItems (hoặc plugin khác) nhận diện vị trí chèn enchant
  placeholder: "{enchants}"

  # Số lượng enchant hiển thị trên 1 dòng
  enchants-per-line: 3

  # Dấu ngăn cách giữa các enchant (Hỗ trợ Legacy & MiniMessage)
  separator: "&8, "

  # Màu mặc định cho các enchant không có trong list bên dưới
  default-color: "&9"

  # Thêm một dòng trống ngay trên danh sách enchant (chỉ khi có lore khác ở trên nó)
  add-empty-line-above: true

  # Thêm một dòng trống ngay dưới danh sách enchant (chỉ khi có lore khác ở dưới nó)
  add-empty-line-below: true

