# ============================================================================== #
# MAX SLOTS CONFIGURATION
# Defines the BASE number of custom enchantments an item can hold.
# Supports Wildcards: *SUFFIX, PREFIX*, *CONTAINS*
# If an item matches multiple, the slot values will be SUMMED.
# Custom Items priority: If a Custom Item (MMOItems, MythicMobs, etc.) matches a rule, Vanilla rules are ignored.
# ============================================================================== #
item-max-slots:
  "*_SWORD": 2
  "*_CHESTPLATE": 3
  "*DIAMOND*": 1

mmoitems-max-slots:
  SWORD:*: 2
  "*:LEGENDARY_*": 3
  ARMOR:MYTHIC_CHESTPLATE: 5

custom-item-max-slots:
  "SWORD:*": 2
  "*:LEGENDARY_*": 3
  "MYTHICMOBS:EXCALIBUR": 5

# ============================================================================== #
# MAX SLOT MODIFIERS CONFIGURATION (SLOT GEMS)
# Defines the MAXIMUM number of EXTRA slots a player can add using Slot Gems.
#
# - Wildcards (*SUFFIX, PREFIX*, *CONTAINS*) are supported.
# - If an item matches multiple lines, the extra slots are SUMMED together.
#   (e.g., A DIAMOND_SWORD matching "*_SWORD" (+3) and "*DIAMOND*" (+2) gets +5 total).
# - PRIORITY RULE: If a Custom Item matches a rule in "custom-item-max-slot-modifiers",
#   the plugin will completely IGNORE the Vanilla "item-max-slot-modifiers" list.
# ============================================================================== #
item-max-slot-modifiers:
  "*_SWORD": 3
  "*_CHESTPLATE": 5
  "*DIAMOND*": 2

mmoitems-max-slot-modifiers:
  SWORD:*: 4
  "*:LEGENDARY_*": 5
  ARMOR:MYTHIC_CHESTPLATE: 8

custom-item-max-slot-modifiers:
  "SWORD:*": 4
  "*:LEGENDARY_*": 5
  "MYTHICMOBS:EXCALIBUR": 8

# ============================================================================== #
# WHITELIST CONFIGURATION
# Defines exactly which enchantments can be applied to specific items.
# Supports Wildcards: *SUFFIX, PREFIX*, *CONTAINS*
# If an item matches multiple, the allowed enchantments will be merged together.
# Custom Items priority: If a Custom Item matches a rule, Vanilla rules are ignored.
