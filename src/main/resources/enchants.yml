# ==========================================
# CUSTOM ENCHANTMENTS
# ==========================================
# Here you configure all custom enchantments loaded by internal modules or external addons.
custom-enchants:

  "since:lifesteal":
    # The display name of the enchantment in the lore.
    name: "Lifesteal"
    # Ties into the 'rarities' section above to determine the color.
    rarity: "EPIC"
    # The absolute maximum level this enchantment can reach.
    max-level: 5
    # What items can this be applied to? (ALL, WEAPON, SWORD, BOW, TOOL, ARMOR)
    target: "WEAPON"
    # The 'requires' list defines enchantments that MUST already exist on the item
    # before a player can apply this enchantment.
    # Example: The weapon MUST have 'Sharpness' applied before you can add 'Lifesteal'.
    requires:
      - "minecraft:sharpness"
    # The description shown on Enchantment Books.
    description:
      - "&7Heals you for a portion"
      - "&7of your max health on hit."
    # Module-specific variables that developers use in their code.
    settings:
      heal-multiplier: 1.0
    # Module-specific chat messages sent to the player.
    messages:
      action: "&a+ %amount% HP (Lifesteal)!"

  "since:fireball":
    name: "Fireball"
    rarity: "LEGENDARY"
    max-level: 3
    target: "SWORD"
    # You can also require multiple custom or vanilla enchantments at the same time.
    # Example: Fireball requires BOTH Vanilla Fire Aspect AND Custom Thunder Strike.
    requires:
      - "minecraft:fire_aspect"
      - "since:thunder"
    description:
      - "&7Left-click the air to"
      - "&7shoot a destructive fireball."
    settings:
      cooldown: 5000 # Cooldown in milliseconds (5000ms = 5 seconds)
      explosion-power: 2.0
    messages:
      on-cooldown: "&cSkill is on cooldown for %time%s!"
      launch: "&6Boom! Fireball launched!"

  "since:thunder":
    name: "Thunder Strike"
    rarity: "RARE"
    max-level: 5
    target: "WEAPON"
    description:
      - "&7Chance to strike lightning"
      - "&7on your enemies."
    settings:
      chance-per-level: 8 # 8% chance per level (Level 5 = 40%)
      extra-damage: 3.0
    messages:
      activate: "&b⚡ Lightning struck the target!"

  "since:excavator":
    name: "Excavator"
    rarity: "LEGENDARY"
    max-level: 2
    target: "TOOL"
    # Example: Excavator requires Vanilla Efficiency to be on the tool first.
    requires:
      - "minecraft:efficiency"
    description:
      - "&7Mines a 3x3 area"
      - "&7around the broken block."
    settings:
      radius: 1 # 1 = 3x3 area, 2 = 5x5 area
    messages:
      activate: "&eArea mining activated!"

  "since:dodge":
    name: "Dodge"
    rarity: "EPIC"
    max-level: 4
    target: "ARMOR"
    description:
      - "&7Chance to completely"
      - "&7evade incoming damage."
    settings:
      chance-per-level: 5 # 5% dodge chance per level
    messages:
      activate: "&fSuccessfully dodged an attack!"

